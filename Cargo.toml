[workspace]
members  = [".", "netmon-common", "xtask"]
resolver = "2"

# netmon-ebpf targets bpfel-unknown-none (no_std, BPF only) and cannot be
# parsed/compiled by a normal `cargo build`.  It lives outside the workspace
# member list and is built exclusively via `cargo xtask build-ebpf` which
# invokes cargo with the correct target and -Z build-std=core.
exclude  = ["netmon-ebpf"]

[package]
name = "netmon"
version = "0.2.0"
edition = "2021"
description = "Network traffic monitor: TUI, continuous log, and Prometheus exporter"
authors = ["netmon"]
license = "MIT"

[[bin]]
name = "netmon"
path = "src/main.rs"

[dependencies]
ratatui    = "0.28"
crossterm  = "0.28"
procfs     = "0.16"
sysinfo    = "0.31"
chrono     = { version = "0.4", features = ["serde"] }
serde      = { version = "1", features = ["derive"] }
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
libc       = "0.2"
# eBPF userspace loader — sync threading, no tokio needed
aya        = "0.13"
aya-log    = "0.2"
log        = "0.4"
# Shared map types between host and eBPF crate
netmon-common = { path = "netmon-common" }

[profile.release]
opt-level = 3
strip     = true
lto       = true

[profile.dev]
opt-level = 1  # faster iteration; eBPF side has its own profile
